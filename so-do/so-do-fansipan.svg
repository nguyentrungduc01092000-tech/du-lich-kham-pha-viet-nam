<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Sơ đồ minh họa ba chặng lên đỉnh Fansipan: thị trấn Sa Pa, tàu Mường Hoa, ga cáp treo, cáp treo, tàu tuyến đỉnh hoặc bậc thang, đỉnh Fansipan 3.143 m">
  <title>Fansipan: ba chặng lên đỉnh — sơ đồ minh họa</title>
  <rect width="720" height="320" fill="#f7f5ef"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a2e">Fansipan: ba chặng lên đỉnh — sơ đồ minh họa</text>
  <text x="360" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Không theo tỷ lệ — xem giá vé và giờ hoạt động trong bài viết, kiểm tra lại trước khi đi</text>
  <!-- stages -->
  <g font-family="sans-serif" font-size="13" fill="#1a3a2e">
    <rect x="40" y="120" width="120" height="64" rx="8" fill="#dcefe6" stroke="#2e7d5b" stroke-width="2"/>
    <text x="100" y="146" text-anchor="middle">Thị trấn Sa Pa</text>
    <text x="100" y="164" text-anchor="middle" font-size="11" fill="#555">Điểm xuất phát</text>
    <rect x="200" y="120" width="120" height="64" rx="8" fill="#dcefe6" stroke="#2e7d5b" stroke-width="2"/>
    <text x="260" y="146" text-anchor="middle">Tàu Mường Hoa</text>
    <text x="260" y="164" text-anchor="middle" font-size="11" fill="#555">Ra ga cáp treo</text>
    <rect x="360" y="120" width="120" height="64" rx="8" fill="#dcefe6" stroke="#2e7d5b" stroke-width="2"/>
    <text x="420" y="146" text-anchor="middle">Cáp treo</text>
    <text x="420" y="164" text-anchor="middle" font-size="11" fill="#555">6.292,5 m · lên 1.410 m</text>
    <rect x="520" y="120" width="160" height="64" rx="8" fill="#f3e2c2" stroke="#c98a2e" stroke-width="2"/>
    <text x="600" y="146" text-anchor="middle">Tàu tuyến đỉnh / bậc thang</text>
    <text x="600" y="164" text-anchor="middle" font-size="11" fill="#555">Lên khu vực đỉnh</text>
  </g>
  <g stroke="#2e7d5b" stroke-width="3" fill="none">
    <line x1="160" y1="152" x2="200" y2="152"/>
    <line x1="320" y1="152" x2="360" y2="152"/>
    <line x1="480" y1="152" x2="520" y2="152"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#1a3a2e">
    <circle cx="360" cy="240" r="10" fill="#c0392b"/>
    <text x="360" y="268" text-anchor="middle">Đỉnh Fansipan — 3.143 m</text>
    <text x="360" y="286" text-anchor="middle" font-size="11" fill="#555">Leo bộ là lựa chọn khác: thường 2 ngày, cần giấy phép và người dẫn đường có giấy phép</text>
  </g>
  <line x1="600" y1="184" x2="360" y2="230" stroke="#c98a2e" stroke-width="2" stroke-dasharray="6 4"/>
</svg>
