<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Sơ đồ minh họa vòng cung Hà Giang 3 ngày 2 đêm: thành phố Hà Giang, Quản Bạ, Yên Minh, Đồng Văn, Lũng Cú và Sà Phìn, đèo Mã Pí Lèng, Mèo Vạc, quay về thành phố Hà Giang">
  <title>Cung Hà Giang 3 ngày 2 đêm — sơ đồ minh họa</title>
  <rect width="720" height="340" fill="#f7f5ef"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a3a2e">Cung Hà Giang 3 ngày 2 đêm — sơ đồ minh họa</text>
  <text x="360" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Không theo tỷ lệ, không phải bản đồ địa lý — xem lịch trình chi tiết trong bài viết</text>
  <!-- route -->
  <path d="M 90 270 L 210 200 L 330 230 L 470 140 L 590 180 L 590 280 L 330 300 Z" fill="none" stroke="#2e7d5b" stroke-width="3" stroke-dasharray="8 5"/>
  <!-- nodes -->
  <g font-family="sans-serif" font-size="13" fill="#1a3a2e">
    <circle cx="90" cy="270" r="10" fill="#2e7d5b"/><text x="70" y="298" text-anchor="middle">TP. Hà Giang</text><text x="70" y="314" text-anchor="middle" font-size="11" fill="#555">Ngày 1: xuất phát</text>
    <circle cx="210" cy="200" r="10" fill="#2e7d5b"/><text x="210" y="180" text-anchor="middle">Quản Bạ</text><text x="210" y="164" text-anchor="middle" font-size="11" fill="#555">Cổng Trời</text>
    <circle cx="330" cy="230" r="10" fill="#2e7d5b"/><text x="330" y="258" text-anchor="middle">Yên Minh</text><text x="330" y="274" text-anchor="middle" font-size="11" fill="#555">Nghỉ đêm 1</text>
    <circle cx="470" cy="140" r="10" fill="#2e7d5b"/><text x="470" y="120" text-anchor="middle">Đồng Văn</text><text x="470" y="104" text-anchor="middle" font-size="11" fill="#555">Nghỉ đêm 2</text>
    <circle cx="590" cy="180" r="8" fill="#c98a2e"/><text x="590" y="158" text-anchor="middle">Lũng Cú · Sà Phìn</text>
    <circle cx="590" cy="280" r="10" fill="#2e7d5b"/><text x="620" y="284" text-anchor="middle">Mèo Vạc</text><text x="620" y="300" text-anchor="middle" font-size="11" fill="#555">Đèo Mã Pí Lèng</text>
    <circle cx="330" cy="300" r="8" fill="#c98a2e"/><text x="330" y="326" text-anchor="middle" font-size="11" fill="#555">Quay về TP. Hà Giang</text>
  </g>
  <text x="360" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Ngày 1: TP. Hà Giang → Quản Bạ → Yên Minh · Ngày 2: Yên Minh → Đồng Văn, ghé Lũng Cú và Sà Phìn · Ngày 3: Đồng Văn → Mã Pí Lèng → Mèo Vạc → về TP. Hà Giang</text>
</svg>
